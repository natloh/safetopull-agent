<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SafeToPull agent</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f5f7; --surface: #ffffff; --raised: #eaeef2; --line: #c5ced8;
  --fg: #0e1620; --muted: #51606f; --accent: #0a58a6; --accent-bg: #e3effb;
  --green: #0c6b35; --amber: #7d5200; --red: #a8231b;
  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --surface: #0b0b0b; --raised: #151515; --line: #2c2c2c;
    --fg: #f1f3f5; --muted: #a0abb6; --accent: #74b6ff; --accent-bg: #0d2238;
    --green: #56d98d; --amber: #f0b955; --red: #ff8278;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
main { max-width: 60rem; margin: 0 auto; padding: 1rem; display: grid; gap: 1.25rem; }
header.bar { border-bottom: 1px solid var(--line); background: var(--surface); }
header.bar > div { max-width: 60rem; margin: 0 auto; padding: .75rem 1rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
h1 { font-size: 1.05rem; margin: 0; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1rem; margin: 0; }
h3 { font-size: .95rem; margin: 0; overflow-wrap: anywhere; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: .8rem; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 1rem; display: grid; gap: .75rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; }
.stack { display: grid; gap: .5rem; }
.pip { font-family: var(--mono); font-size: .75rem; font-weight: 700; display: inline-flex; gap: .4rem; align-items: center; white-space: nowrap; }
.pip::before { content: ""; width: .6rem; height: .6rem; background: currentColor; }
.green { color: var(--green); } .yellow { color: var(--amber); } .red { color: var(--red); } .unknown { color: var(--muted); }
.service { border-left: 4px solid var(--line); }
.service.green { border-left-color: var(--green); color: inherit; }
.service.yellow { border-left-color: var(--amber); color: inherit; }
.service.red { border-left-color: var(--red); color: inherit; }
button, input { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: .35rem .8rem; font-size: .8rem; font-weight: 700; cursor: pointer; }
button:hover { background: var(--accent-bg); }
button.primary { border-color: var(--accent); background: var(--accent-bg); }
button.danger { border-left-color: var(--red); }
button:disabled { opacity: .5; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label { display: grid; gap: .25rem; font-size: .8rem; font-weight: 700; }
input { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: .45rem .6rem; font-family: var(--mono); font-size: .85rem; width: 100%; }
form { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); align-items: end; }
.alert { border: 1px solid currentColor; padding: .6rem .8rem; font-size: .85rem; }
ol, ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .4rem; font-size: .85rem; }
code { font-family: var(--mono); font-size: .8rem; background: var(--raised); padding: .1rem .3rem; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: .75rem; }
th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.scroll { overflow-x: auto; }
</style>
</head>
<body>
<header class="bar"><div>
  <h1>SafeToPull agent</h1>
  <span class="mono muted" id="meta">loading…</span>
</div></header>
<main id="app" aria-live="polite"><p class="muted">Reading what runs on this host…</p></main>
<script>
"use strict";

const VERDICTS = {
  green: ["0x00", "SAFE"],
  yellow: ["0x01", "STEPS"],
  red: ["0x02", "HOLD"],
  unknown: ["0x--", "UNKNOWN"],
};
const SENT = [
  "App name, image reference, running and target version of each tracked app",
  "The verdict, its one-line summary and how many findings it has",
  "Agent version, CPU architecture, update mode and whether remote actions are on",
];
const state = { token: sessionStorage.getItem("stp-token") || "", status: null, open: new Set(), notice: null, busy: false };

function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(props || {})) {
    if (name === "class") node.className = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else if (value === true) node.setAttribute(name, "");
    else if (value !== false && value != null) node.setAttribute(name, value);
  }
  for (const child of children.flat()) {
    if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

async function api(path, body) {
  const headers = { Accept: "application/json" };
  const init = { headers };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  if (body !== undefined) {
    init.method = "POST";
    init.body = JSON.stringify(body);
    headers["Content-Type"] = "application/json";
    headers["X-STP-Request"] = "1";
  }
  const response = await fetch(`/api${path}`, init);
  if (response.status === 401) {
    const token = window.prompt("This agent is protected. Enter its STP_API_TOKEN:");
    if (!token) throw new Error("An API token is required.");
    state.token = token;
    sessionStorage.setItem("stp-token", token);
    return api(path, body);
  }
  const data = response.status === 204 ? null : await response.json().catch(() => null);
  if (!response.ok) throw new Error((data && data.error) || `Request failed (HTTP ${response.status}).`);
  return data;
}

async function act(work, done) {
  state.busy = true;
  state.notice = null;
  render();
  try {
    const result = await work();
    state.notice = { tone: "green", text: typeof done === "function" ? done(result) : done };
  } catch (error) {
    state.notice = { tone: "red", text: error.message };
  }
  state.busy = false;
  await load();
}

async function load() {
  try {
    state.status = await api("/status");
  } catch (error) {
    state.notice = { tone: "red", text: error.message };
  }
  render();
}

function when(seconds) {
  return seconds ? new Date(seconds * 1000).toLocaleString() : "never";
}

function pip(verdict, label) {
  const [code, text] = VERDICTS[verdict];
  return h("span", { class: `pip ${verdict}` }, `${code} // ${label || text}`);
}

function update(service) {
  const careful = service.verdict === "yellow";
  const question = careful
    ? `Update ${service.name} to ${service.target_version}?\n\nThis update has steps to follow first. Confirm only if you have read and handled them.`
    : `Update ${service.name} to ${service.target_version}? The container is recreated from its current settings.`;
  if (!window.confirm(question)) return;
  act(() => api("/update", { key: service.key, acknowledged: careful }), (result) => `${service.name} updated to ${result.updated_to}.`);
}

function serviceCard(service) {
  const open = state.open.has(service.key);
  const assessment = service.assessment;
  const versions = [service.current_version || "unknown version", service.up_to_date ? null : service.target_version]
    .filter(Boolean)
    .join(" → ");
  const toggle = () => {
    if (open) state.open.delete(service.key);
    else state.open.add(service.key);
    render();
  };

  return h("article", { class: `panel service ${service.verdict}` },
    h("div", { class: "row" },
      h("div", { class: "stack" },
        h("h3", null, service.stack ? `${service.stack} / ${service.name}` : service.name),
        h("span", { class: "mono muted" }, `${service.app_name} · ${versions}`),
      ),
      pip(service.verdict, service.up_to_date ? "UP TO DATE" : null),
    ),
    h("p", null, h("strong", null, service.headline), service.summary ? ` — ${service.summary}` : ""),
    service.update_note && h("p", { class: "muted" }, service.update_note),
    h("div", { class: "row" },
      h("span", { class: "mono muted" }, service.image),
      h("span", { class: "row" },
        assessment && h("button", { "aria-expanded": String(open), onclick: toggle }, open ? "Hide steps" : "Show steps"),
        service.can_update && h("button", { class: "primary", disabled: state.busy, onclick: () => update(service) }, `Update to ${service.target_version}`),
      ),
    ),
    open && assessment && h("div", { class: "stack" },
      h("h3", null, "What to do, in order"),
      h("ol", null, assessment.steps.map((step) => h("li", null,
        h("strong", null, step.title),
        step.detail && h("div", { class: "muted" }, step.detail),
        step.command && h("div", null, h("code", null, step.command)),
      ))),
      assessment.findings.length > 0 && h("h3", null, "Why"),
      assessment.findings.length > 0 && h("ul", null, assessment.findings.map((finding) => h("li", null,
        h("span", { class: "mono" }, `${finding.severity} · ${finding.release} · `),
        finding.explanation,
      ))),
    ),
  );
}

function cloudPanel(status) {
  const sent = h("ul", { class: "muted" }, SENT.map((line) => h("li", null, line)));

  if (status.cloud) {
    return h("section", { class: "panel" },
      h("div", { class: "row" },
        h("h2", null, "Cloud link"),
        h("button", { class: "danger", disabled: state.busy, onclick: () => {
          if (window.confirm("Unlink this agent? It keeps working locally and stops reporting.")) {
            act(() => api("/cloud/unlink", {}), "Unlinked. This agent no longer reports anywhere.");
          }
        } }, "Unlink"),
      ),
      h("p", null, "Linked to ", h("code", null, status.cloud.cloud_url), " as ", h("strong", null, status.cloud.host_name), "."),
      h("p", { class: "muted" }, "After each scan this agent sends exactly this, and nothing about untracked containers:"),
      sent,
      h("p", { class: "muted" }, status.remote_actions && status.update_mode === "apply"
        ? "Updates requested from the account are applied by this agent."
        : "Updates requested from the account are refused: remote actions are off on this host."),
    );
  }

  const submit = (event) => {
    event.preventDefault();
    const form = new FormData(event.target);
    act(() => api("/cloud/pair", { code: form.get("code"), name: form.get("name"), cloud_url: form.get("cloud_url") }),
      (link) => `Linked as ${link.host_name}.`);
  };

  return h("section", { class: "panel" },
    h("h2", null, "Cloud link (optional)"),
    h("p", { class: "muted" }, "Not linked. This agent works on its own and reports nowhere. Link it only if you want to see several hosts in one account."),
    h("form", { onsubmit: submit },
      h("label", null, "Pairing code", h("input", { name: "code", required: true, autocomplete: "off", placeholder: "ABCDE-FGHJK" })),
      h("label", null, "Name for this host", h("input", { name: "name", required: true, maxlength: "100", placeholder: "nas" })),
      h("label", null, "Account address", h("input", { name: "cloud_url", required: true, value: status.default_cloud_url })),
      h("button", { class: "primary", type: "submit", disabled: state.busy }, "Link this host"),
    ),
    h("p", { class: "muted" }, "If you link it, it sends only:"),
    sent,
  );
}

function render() {
  const root = document.getElementById("app");
  const status = state.status;
  const notice = state.notice && h("p", { class: `alert ${state.notice.tone}`, role: "status" }, state.notice.text);

  if (!status) {
    root.replaceChildren(notice || h("p", { class: "muted" }, "Reading what runs on this host…"));
    return;
  }

  const snapshot = status.snapshot;
  const count = (verdict) => snapshot.services.filter((service) => service.verdict === verdict && !service.up_to_date).length;
  const current = snapshot.services.filter((service) => service.up_to_date).length;
  document.getElementById("meta").textContent =
    `v${status.agent_version} · ${status.arch} · ${status.update_mode === "apply" ? "applies updates when asked" : "advisory only"}`;

  root.replaceChildren(...[
    notice,
    snapshot.docker_error && h("p", { class: "alert red", role: "alert" }, `Cannot read Docker: ${snapshot.docker_error}`),
    snapshot.dataset_error && h("p", { class: "alert red", role: "alert" }, `No release data: ${snapshot.dataset_error}`),
    snapshot.dataset_stale && h("p", { class: "alert yellow" }, "The release dataset could not be refreshed, so verdicts use the last downloaded copy."),
    h("section", { class: "panel" },
      h("div", { class: "row" },
        h("h2", null, `${snapshot.services.length} tracked ${snapshot.services.length === 1 ? "app" : "apps"} on this host`),
        h("button", { disabled: state.busy, onclick: () => act(() => api("/refresh", {}), "Checked just now.") }, "Check now"),
      ),
      h("div", { class: "row" },
        h("span", { class: "row" },
          pip("green", `${current} UP TO DATE`), pip("green", `${count("green")} SAFE`),
          pip("yellow", `${count("yellow")} STEPS`), pip("red", `${count("red")} HOLD`),
          count("unknown") > 0 && pip("unknown", `${count("unknown")} UNKNOWN`),
        ),
        h("span", { class: "mono muted" }, `last scan ${when(snapshot.scanned_at)}`),
      ),
      h("p", { class: "muted" }, `${snapshot.untracked_containers} other running ${snapshot.untracked_containers === 1 ? "container is" : "containers are"} not in the dataset. They are ignored and never reported.`),
    ),
    ...snapshot.services.map(serviceCard),
    cloudPanel(status),
    h("section", { class: "panel" },
      h("h2", null, "Network activity"),
      h("p", { class: "muted" }, "Every request this agent has made beyond this host since it started (newest first, last 50). Release data comes from ", h("code", null, status.dataset_url), "."),
      h("div", { class: "scroll" }, h("table", null,
        h("thead", null, h("tr", null, ["When", "Why", "Request", "Status"].map((title) => h("th", { scope: "col" }, title)))),
        h("tbody", null, status.outbound.length === 0
          ? h("tr", null, h("td", { colspan: "4" }, "Nothing yet."))
          : status.outbound.map((record) => h("tr", null,
              h("td", null, when(record.at)), h("td", null, record.purpose),
              h("td", null, `${record.method} ${record.url}`), h("td", null, record.status == null ? "failed" : record.status),
            ))),
      )),
    ),
  ].filter(Boolean));
}

load();
setInterval(() => { if (!state.busy && !document.hidden) load(); }, 30000);
</script>
</body>
</html>
