name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: stp-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as a non-root user and reports its version
        run: |
          test "$(docker image inspect stp-agent:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --read-only --cap-drop ALL stp-agent:ci --version
