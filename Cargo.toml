[package]
name = "stp-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "SafeToPull host agent: read-only update safety checks for the containers you run"
license = "AGPL-3.0-only"
repository = "https://github.com/natloh/safetopull-agent"
publish = false

[features]
default = ["tls"]
tls = ["reqwest/rustls-tls"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "signal", "sync"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
